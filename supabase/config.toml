# =============================================================================
# Supabase Local Configuration for Sweep
# Path: supabase/config.toml
# =============================================================================

project_id = "sweep"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = [
  "./seeds/00-reference-categories.sql",
  "./seeds/01-reference-payment-methods.sql"
]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://sweep.app/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[remotes.production]
project_id = "zsycpokyuqzilptmdcme"

# The GitHub link applies this file to the live project on every push to main,
# so the live login addresses must be set here or they get reset to localhost.
[remotes.production.auth]
site_url = "https://sift-sand.vercel.app"
additional_redirect_urls = [
  "https://sweep-subs.vercel.app/**",
  "https://sift-sand.vercel.app/**",
  "http://localhost:3000/**"
]

[remotes.production.db.seed]
enabled = true
sql_paths = [
  "./seeds/00-reference-categories.sql",
  "./seeds/01-reference-payment-methods.sql"
]
